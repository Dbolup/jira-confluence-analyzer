<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confluence Space Compare</title>
    <style>
        :root { --bg: #ffffff; --fg: #000000; --border: #e5e5e5; --sidebar: #0a0a0a; --sidebar-text: #a3a3a3; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        body { display: flex; height: 100vh; background: var(--bg); color: var(--fg); overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--sidebar); display: flex; flex-direction: column; padding: 2.5rem 2rem; border-right: 1px solid #222; }
        .logo { color: #fff; font-size: 1.1rem; font-weight: 600; letter-spacing: 2px; margin-bottom: 3rem; text-transform: uppercase; }
        .nav-item { display: block; color: var(--sidebar-text); text-decoration: none; padding: 0.6rem 0; font-size: 0.9rem; transition: 0.2s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { color: #fff; }
        .nav-group { margin-bottom: 1.5rem; }
        .nav-title { display: flex; justify-content: space-between; color: #fff; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 0.6rem 0; cursor: pointer; border-bottom: 1px solid #333; margin-bottom: 0.5rem; }
        .submenu { display: none; padding-left: 0.5rem; } .submenu.open { display: block; }
        
        .main-content { flex: 1; overflow-y: auto; padding: 3rem 4rem; }
        h1 { font-size: 1.8rem; font-weight: 400; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; letter-spacing: -0.5px; }
        
        .btn { background: var(--fg); color: var(--bg); border: 1px solid var(--fg); padding: 0.6rem 1.2rem; cursor: pointer; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; transition: 0.2s; }
        .btn:hover { background: var(--bg); color: var(--fg); }
        .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; }
        .btn-ghost:hover { border-color: var(--fg); }
        
        .row-card { border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1rem; display: flex; gap: 1rem; align-items: flex-end; background: #fafafa; }
        label { display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; color: #666; }
        select, input { width: 100%; padding: 0.6rem; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 0.9rem; }
        select:focus, input:focus { outline: none; border-color: var(--fg); }
        
        .table-wrapper { overflow-x: auto; margin-top: 2rem; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 1rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
        th { font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.5px; color: #666; background: #fafafa; border-right: 1px solid var(--border); }
        td { border-right: 1px solid var(--border); font-family: monospace; font-size: 0.9rem; }
        td:first-child { font-weight: 600; font-family: 'Inter', sans-serif; background: #fafafa; color: #000; width: 220px; }
        tr:last-child td { border-bottom: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">Analyzer</div>
        
        <div class="nav-group">
            <a href="/" class="nav-title" style="text-decoration: none; display: block;">HOME</a>
        </div>
        
        <div class="nav-group">
            <a href="/credentials" class="nav-title" style="text-decoration: none; display: block;">CREDENTIALS</a>
        </div>

        <div class="nav-group">
            <div class="nav-title" onclick="toggleMenu('jira-menu')">JIRA <span id="jira-icon">+</span></div>
            <div class="submenu" id="jira-menu">
                <a href="/jira-stats" class="nav-item">General Stats</a>
                <a href="/compare" class="nav-item">Compare Projects</a>
            </div>
        </div>

        <div class="nav-group">
            <div class="nav-title" onclick="toggleMenu('conf-menu')">CONFLUENCE <span id="conf-icon">+</span></div>
            <div class="submenu" id="conf-menu">
                <a href="/confluence-stats" class="nav-item">General Stats</a>
                <a href="/confluence-compare" class="nav-item">Compare Spaces</a>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <h1>Confluence Space Comparison</h1>
        <div id="rows-container"></div>
        <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
            <button class="btn btn-ghost" style="border:1px solid #000" onclick="addRow()">Add Space</button>
            <button class="btn" onclick="runCompare()">Run Comparison</button>
            <button class="btn btn-ghost" style="margin-left:auto" onclick="window.print()">Print / PDF</button>
        </div>
        <div id="results-area"></div>
    </div>

    <script>
        function toggleMenu(id) { const el = document.getElementById(id); const icon = document.getElementById(id.split('-')[0] + '-icon'); if(el.classList.contains('open')) { el.classList.remove('open'); icon.innerText = '+'; } else { el.classList.add('open'); icon.innerText = '-'; } }

        const defCreds = JSON.parse(localStorage.getItem('defaultCloudCreds') || '{}');
        const cloudSites = JSON.parse(localStorage.getItem('savedCloudSites') || '[]');
        const dcConns = JSON.parse(localStorage.getItem('savedDCConnections') || '[]');
        addRow(); addRow();

        function addRow() {
            const div = document.createElement('div'); div.className = 'row-card';
            let opts = '<option value="">-- Select Source --</option>';
            if(cloudSites.length) { opts += '<optgroup label="Saved Cloud">'; cloudSites.forEach((s,i)=>opts+=`<option value="c-${i}">${s.domain}</option>`); opts += '</optgroup>'; }
            if(dcConns.length) { opts += '<optgroup label="Data Center">'; dcConns.forEach((s,i)=>opts+=`<option value="d-${i}">${s.name}</option>`); opts += '</optgroup>'; }
            div.innerHTML = `<div style="flex:1"><label>Source</label><select class="src-select" onchange="loadSpaces(this)">${opts}<option value="manual">Manual Cloud Domain...</option></select><input class="man-dom" placeholder="domain (uses default creds)" style="display:none; margin-top:5px" onblur="loadSpaces(this.previousElementSibling)"></div><div style="flex:1.5"><label>Space</label><select class="space-select" disabled><option>Select source first...</option></select></div><button class="btn btn-ghost" onclick="this.parentElement.remove()">✕</button>`;
            document.getElementById('rows-container').appendChild(div);
        }

        async function loadSpaces(el) {
            const val = el.value; const manInp = el.nextElementSibling; const spaceSelect = el.parentElement.nextElementSibling.querySelector('select');
            let config = {};
            if(val === 'manual') { manInp.style.display = 'block'; if(!manInp.value) return; if(!defCreds.email) return alert('Save default creds first'); config = { type:'cloud', domain: manInp.value, email: defCreds.email, token: defCreds.token }; }
            else { manInp.style.display = 'none'; if(!val) { spaceSelect.disabled=true; return; } const [type, idx] = val.split('-'); if(type==='c') { config = { type:'cloud', ...cloudSites[idx] }; } else { config = { type:'dc', ...dcConns[idx] }; } }
            
            spaceSelect.innerHTML = '<option>Loading...</option>';
            try {
                const res = await fetch('/api/confluence/spaces', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ sources: [config] }) });
                const data = await res.json();
                let html = '<option value="">-- Select Space --</option>';
                data.results[0].spaces.forEach(s => { html += `<option value="${s.key}" data-name="${s.name}" data-source='${JSON.stringify(config)}'>${s.name} (${s.key})</option>`; });
                spaceSelect.innerHTML = html; spaceSelect.disabled = false;
            } catch(e) { spaceSelect.innerHTML = `<option>Error: ${e.message}</option>`; }
        }

        async function runCompare() {
            const spaces = [];
            document.querySelectorAll('.space-select').forEach(s => { if(s.value && !s.disabled) { const opt = s.options[s.selectedIndex]; spaces.push({ source: JSON.parse(opt.getAttribute('data-source')), spaceKey: s.value, spaceName: opt.getAttribute('data-name') }); } });
            if(!spaces.length) return alert("Please select at least one space");
            
            const btn = document.querySelector('.btn'); const oldText = btn.innerText; btn.innerText = 'Processing...'; btn.disabled = true;
            try {
                const res = await fetch('/api/confluence/compare-spaces', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ spaces }) });
                const data = await res.json();
                
                const metrics = [['owner', 'Owner'],['pages', 'Pages'],['blogposts', 'Blog Posts'],['attachments', 'Attachments'],['databases', 'Databases'],['whiteboards', 'Whiteboards'],['folders', 'Folders'],['smartlinks', 'Smart Links'],['calendars', 'Calendars'],['spaceCalendars', 'Space Calendars']];
                let html = '<div class="table-wrapper"><table><thead><tr><th>Metric</th>';
                data.results.forEach(r => { const headerName = r.source.domain || r.source.name || r.source || "Unknown Source"; html += `<th>${headerName}<br><span style="font-weight:400; font-size:0.8em; color:#666">${r.spaceName} (${r.type})</span></th>`; });
                html += '</tr></thead><tbody>';
                
                metrics.forEach(([key, label]) => { 
                    html += `<tr><td>${label}</td>` + data.results.map(r => { 
                        if(r.error) return `<td style="color:red">Error</td>`; 
                        if(r[key] === null) return `<td style="color:#aaa; font-style:italic">N/A</td>`; 
                        return `<td>${r[key]||0}</td>`; 
                    }).join('') + '</tr>'; 
                });
                document.getElementById('results-area').innerHTML = html + '</tbody></table></div>';
            } catch(e) { alert(e.message); }
            btn.innerText = oldText; btn.disabled = false;
        }
    </script>
</body>
</html>
