<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Credentials</title>
    <style>
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .container { background: white; padding: 2.5rem; border-radius: 20px; width: 100%; max-width: 800px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        h1 { color: #1e293b; margin-bottom: 1.5rem; text-align: center; }
        .section { margin-bottom: 2rem; border: 1px solid #e2e8f0; padding: 1.5rem; border-radius: 12px; }
        h3 { margin-top: 0; color: #334155; border-bottom: 2px solid #f1f5f9; padding-bottom: 0.5rem; margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #475569; }
        input, select { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; }
        .row { display: flex; gap: 1rem; }
        .col { flex: 1; }
        button { padding: 0.8rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-save { background: #10b981; color: white; width: 100%; }
        .btn-clear { background: #ef4444; color: white; margin-top: 1rem; width: 100%; }
        .btn-back { background: #64748b; color: white; margin-bottom: 1rem; }
        .saved-list { margin-top: 1rem; }
        .tag { display: inline-block; background: #e0f2fe; color: #0284c7; padding: 5px 10px; border-radius: 15px; font-size: 0.85rem; margin-right: 5px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/"><button class="btn-back">⬅ Dashboard</button></a>
        <h1>Manage Connections</h1>

        <div class="section">
            <h3>☁️ Cloud Credentials (Global)</h3>
            <div class="row">
                <div class="col"><label>Email</label><input id="cloud-email" placeholder="email@company.com"></div>
                <div class="col"><label>API Token</label><input id="cloud-token" type="password" placeholder="Atlassian API Token"></div>
            </div>
            <button class="btn-save" onclick="saveCloud()">Update Cloud Credentials</button>
        </div>

        <div class="section">
            <h3>🏢 Data Center (Database)</h3>
            <div class="row">
                <div class="col"><label>Connection Name</label><input id="dc-name" placeholder="e.g. Prod Jira DB"></div>
                <div class="col">
                    <label>Type</label>
                    <select id="dc-type">
                        <option value="postgres">PostgreSQL</option>
                        <option value="mysql">MySQL</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col"><label>Host</label><input id="dc-host" placeholder="localhost"></div>
                <div class="col"><label>Port</label><input id="dc-port" placeholder="5432"></div>
            </div>
            <div class="row">
                <div class="col"><label>Database</label><input id="dc-db" placeholder="jira_db"></div>
                <div class="col"><label>User</label><input id="dc-user" placeholder="postgres"></div>
            </div>
            <div class="row">
                <div class="col"><label>Password</label><input id="dc-pass" type="password"></div>
            </div>
            <button class="btn-save" style="background:#6366f1" onclick="addDC()">Add Database Connection</button>
            
            <div class="saved-list" id="dc-list"></div>
        </div>

        <button class="btn-clear" onclick="clearAll()">🗑️ Clear All Credentials</button>
    </div>

    <script>
        // Load on Init
        const cloud = JSON.parse(localStorage.getItem('atlassianGlobalCreds') || '{}');
        if(cloud.email) {
            document.getElementById('cloud-email').value = cloud.email;
            document.getElementById('cloud-token').value = cloud.token;
        }
        renderDCList();

        function saveCloud() {
            const email = document.getElementById('cloud-email').value;
            const token = document.getElementById('cloud-token').value;
            localStorage.setItem('atlassianGlobalCreds', JSON.stringify({ email, token }));
            alert('Cloud credentials saved!');
        }

        function addDC() {
            const name = document.getElementById('dc-name').value;
            if(!name) return alert('Name is required');
            
            const newConn = {
                name: name,
                type: document.getElementById('dc-type').value,
                host: document.getElementById('dc-host').value,
                port: document.getElementById('dc-port').value,
                database: document.getElementById('dc-db').value,
                user: document.getElementById('dc-user').value,
                password: document.getElementById('dc-pass').value
            };

            const existing = JSON.parse(localStorage.getItem('dcConnections') || '[]');
            existing.push(newConn);
            localStorage.setItem('dcConnections', JSON.stringify(existing));
            
            renderDCList();
            // Clear inputs
            document.querySelectorAll('#dc-name, #dc-host, #dc-db, #dc-user, #dc-pass').forEach(i => i.value = '');
        }

        function renderDCList() {
            const existing = JSON.parse(localStorage.getItem('dcConnections') || '[]');
            const container = document.getElementById('dc-list');
            container.innerHTML = existing.length ? '<strong>Saved Connections:</strong><br>' : '';
            existing.forEach((c, idx) => {
                container.innerHTML += `<span class="tag" onclick="removeDC(${idx})" style="cursor:pointer" title="Click to remove">🏢 ${c.name} (${c.type}) ❌</span>`;
            });
        }

        function removeDC(idx) {
            if(!confirm('Remove this connection?')) return;
            const existing = JSON.parse(localStorage.getItem('dcConnections') || '[]');
            existing.splice(idx, 1);
            localStorage.setItem('dcConnections', JSON.stringify(existing));
            renderDCList();
        }

        function clearAll() {
            if(confirm('Are you sure? This deletes ALL saved credentials.')) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
