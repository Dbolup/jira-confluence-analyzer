<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Credentials Manager</title>
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; background: #f8fafc; padding: 2rem; color:#334155; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 3rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { font-size: 1.8rem; color: #1e293b; margin-bottom: 2rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 1rem; }
        
        .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; background: #fff; transition: 0.2s; }
        .card:hover { border-color: #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .card-title { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        
        .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-primary { background: #3b82f6; color: white; } .btn-primary:hover { background: #2563eb; }
        .btn-success { background: #10b981; color: white; } .btn-success:hover { background: #059669; }
        .btn-danger { background: #fee2e2; color: #ef4444; } .btn-danger:hover { background: #fecaca; }
        .btn-ghost { background: transparent; color: #64748b; } .btn-ghost:hover { color: #334155; text-decoration: underline; }

        /* List Items */
        .item-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; background: #f8fafc; border-radius: 8px; border: 1px solid #f1f5f9; }
        .item-name { font-weight: 600; color: #475569; }
        .item-meta { font-size: 0.85rem; color: #94a3b8; margin-left: 10px; }

        /* Forms (Hidden by default) */
        .form-panel { display: none; background: #f8fafc; padding: 1.5rem; border-radius: 12px; border: 1px solid #e2e8f0; margin-top: 1rem; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        input, select { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; color: #475569; }
        .row { display: flex; gap: 1rem; }
        .col { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
            <a href="/" class="btn btn-ghost">⬅ Back to Dashboard</a>
            <h2 style="margin:0">Credentials Vault</h2>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">☁️ Default Cloud Identity</div>
                <button class="btn btn-primary" onclick="toggleForm('def-form')">Configure</button>
            </div>
            <div id="def-status" style="font-size:0.9rem; color:#64748b;">Not configured</div>
            
            <div id="def-form" class="form-panel">
                <label>Email Address</label><input id="def-email">
                <label>Atlassian API Token</label><input id="def-token" type="password">
                <div style="text-align:right">
                    <button class="btn btn-ghost" onclick="toggleForm('def-form')">Cancel</button>
                    <button class="btn btn-success" onclick="saveDef()">Save Identity</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">🌐 Saved Cloud Sites</div>
                <button class="btn btn-primary" onclick="toggleForm('cloud-form')">+ Add Site</button>
            </div>
            <div id="cloud-list" class="item-list"></div>

            <div id="cloud-form" class="form-panel">
                <div class="row">
                    <div class="col"><label>Domain (e.g. acme.atlassian.net)</label><input id="c-dom"></div>
                    <div class="col"><label>Email</label><input id="c-em"></div>
                </div>
                <label>API Token</label><input id="c-tok" type="password">
                <div style="text-align:right">
                    <button class="btn btn-ghost" onclick="toggleForm('cloud-form')">Cancel</button>
                    <button class="btn btn-success" onclick="addCloud()">Save Site</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">🏢 Data Center Connections</div>
                <button class="btn btn-primary" onclick="toggleForm('dc-form')">+ Add Database</button>
            </div>
            <div id="dc-list" class="item-list"></div>

            <div id="dc-form" class="form-panel">
                <div class="row">
                    <div class="col"><label>Friendly Name</label><input id="dc-name" placeholder="Prod DB"></div>
                    <div class="col" style="flex:0.3"><label>SSL?</label><input type="checkbox" id="dc-ssl" style="width:20px;height:20px;margin-top:10px"></div>
                    <div class="col"><label>Type</label><select id="dc-type"><option value="postgres">PostgreSQL</option><option value="mysql">MySQL</option></select></div>
                </div>
                <div class="row">
                    <div class="col" style="flex:2"><label>Host</label><input id="dc-host"></div>
                    <div class="col"><label>Port</label><input id="dc-port"></div>
                    <div class="col"><label>Database</label><input id="dc-db"></div>
                </div>
                <div class="row">
                    <div class="col"><label>User</label><input id="dc-user"></div>
                    <div class="col"><label>Password</label><input id="dc-pass" type="password"></div>
                </div>
                <div style="display:flex; justify-content:space-between">
                    <button class="btn" style="background:#f59e0b; color:white" onclick="testDC()">🔌 Test Connection</button>
                    <div>
                        <button class="btn btn-ghost" onclick="toggleForm('dc-form')">Cancel</button>
                        <button class="btn btn-success" onclick="addDC()">Save Database</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const def = JSON.parse(localStorage.getItem('defaultCloudCreds') || '{}');
        let clouds = JSON.parse(localStorage.getItem('savedCloudSites') || '[]');
        let dcs = JSON.parse(localStorage.getItem('savedDCConnections') || '[]');

        function init() {
            // Default Status
            const status = document.getElementById('def-status');
            if(def.email) {
                status.innerHTML = `✅ Configured as <strong>${def.email}</strong>`;
                status.style.color = '#10b981';
                document.getElementById('def-email').value = def.email;
                document.getElementById('def-token').value = def.token;
            } else {
                status.innerHTML = '⚠️ No default identity set. You will need to enter creds for every site.';
            }
            renderLists();
        }

        function toggleForm(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function saveDef() {
            const email = document.getElementById('def-email').value;
            const token = document.getElementById('def-token').value;
            localStorage.setItem('defaultCloudCreds', JSON.stringify({email, token}));
            location.reload();
        }

        function addCloud() {
            const domain = document.getElementById('c-dom').value;
            const email = document.getElementById('c-em').value;
            const token = document.getElementById('c-tok').value;
            if(!domain) return alert('Domain required');
            clouds.push({domain, email, token});
            localStorage.setItem('savedCloudSites', JSON.stringify(clouds));
            toggleForm('cloud-form');
            renderLists();
        }

        async function testDC() {
            const config = getDCConfig();
            try {
                const res = await fetch('/api/test-db', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(config)});
                const d = await res.json();
                alert(d.success ? '✅ Connection Successful!' : '❌ Failed: '+d.error);
            } catch(e){ alert(e.message); }
        }

        function addDC() {
            const config = getDCConfig();
            if(!config.name) return alert('Name required');
            dcs.push(config);
            localStorage.setItem('savedDCConnections', JSON.stringify(dcs));
            toggleForm('dc-form');
            renderLists();
        }

        function getDCConfig() {
            return {
                name: document.getElementById('dc-name').value,
                type: document.getElementById('dc-type').value,
                host: document.getElementById('dc-host').value,
                port: document.getElementById('dc-port').value,
                database: document.getElementById('dc-db').value,
                user: document.getElementById('dc-user').value,
                password: document.getElementById('dc-pass').value,
                ssl: document.getElementById('dc-ssl').checked
            };
        }

        function remove(type, i) {
            if(!confirm('Delete this?')) return;
            if(type === 'c') { clouds.splice(i,1); localStorage.setItem('savedCloudSites', JSON.stringify(clouds)); }
            else { dcs.splice(i,1); localStorage.setItem('savedDCConnections', JSON.stringify(dcs)); }
            renderLists();
        }

        function renderLists() {
            const cList = document.getElementById('cloud-list');
            cList.innerHTML = clouds.length ? '' : '<div style="padding:10px; color:#94a3b8; font-style:italic">No saved sites yet.</div>';
            clouds.forEach((s, i) => {
                cList.innerHTML += `
                <div class="item">
                    <div><span class="item-name">${s.domain}</span><span class="item-meta">${s.email}</span></div>
                    <button class="btn btn-danger" onclick="remove('c',${i})">Remove</button>
                </div>`;
            });

            const dList = document.getElementById('dc-list');
            dList.innerHTML = dcs.length ? '' : '<div style="padding:10px; color:#94a3b8; font-style:italic">No saved databases yet.</div>';
            dcs.forEach((s, i) => {
                dList.innerHTML += `
                <div class="item">
                    <div><span class="item-name">${s.name}</span><span class="item-meta">${s.type} @ ${s.host}</span></div>
                    <button class="btn btn-danger" onclick="remove('d',${i})">Remove</button>
                </div>`;
            });
        }

        init();
    </script>
</body>
</html>
