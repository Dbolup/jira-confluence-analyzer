<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Credentials - Jira Analyzer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
        }
        input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }
        .help-text {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 0.5rem;
        }
        .success {
            background: #10b981;
            color: white;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Setup Credentials</h1>
        <form id="credentials-form">
            <div class="form-group">
                <label for="email">📧 Email</label>
                <input type="email" id="email" required placeholder="your.email@company.com">
                <div class="help-text">Your Atlassian account email</div>
            </div>
            
            <div class="form-group">
                <label for="token">🔐 API Token</label>
                <input type="password" id="token" required placeholder="Your API token">
                <div class="help-text">Generate from: Account Settings → Security → API tokens</div>
            </div>
            
            <button type="submit">💾 Save Credentials</button>
        </form>
        
        <div id="success-message" style="display: none;" class="success">
            ✅ Credentials saved! <a href="/" style="color: white; text-decoration: underline;">Go to analyzer</a>
        </div>
    </div>

    <script>
        // Load existing credentials if any
        const savedCreds = localStorage.getItem('atlassianGlobalCreds');
        if (savedCreds) {
            const creds = JSON.parse(savedCreds);
            document.getElementById('email').value = creds.email || '';
            document.getElementById('token').value = creds.token || '';
        }

        document.getElementById('credentials-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const token = document.getElementById('token').value;
            
            // Save to localStorage
            localStorage.setItem('atlassianGlobalCreds', JSON.stringify({ email, token }));
            
            // Show success message
            document.getElementById('success-message').style.display = 'block';
            
            // Redirect after 2 seconds
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        });
    </script>
</body>
</html>
