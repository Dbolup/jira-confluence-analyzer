<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Credentials</title>
    <style>
        :root { --bg: #ffffff; --fg: #000000; --border: #e5e5e5; --sidebar: #0a0a0a; --sidebar-text: #a3a3a3; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        body { display: flex; height: 100vh; background: var(--bg); color: var(--fg); overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--sidebar); display: flex; flex-direction: column; padding: 2.5rem 2rem; border-right: 1px solid #222; }
        .logo { color: #fff; font-size: 1.1rem; font-weight: 600; letter-spacing: 2px; margin-bottom: 3rem; text-transform: uppercase; }
        .nav-item { display: block; color: var(--sidebar-text); text-decoration: none; padding: 0.6rem 0; font-size: 0.9rem; transition: 0.2s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { color: #fff; }
        .nav-group { margin-bottom: 1.5rem; }
        .nav-title { display: flex; justify-content: space-between; color: #fff; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 0.6rem 0; cursor: pointer; border-bottom: 1px solid #333; margin-bottom: 0.5rem; }
        .submenu { display: none; padding-left: 0.5rem; } .submenu.open { display: block; }
        
        .main-content { flex: 1; overflow-y: auto; padding: 3rem 4rem; }
        h1 { font-size: 1.8rem; font-weight: 400; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; letter-spacing: -0.5px; }
        
        .card { border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1.5rem; background: #fafafa; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .card-title { font-weight: 600; font-size: 1rem; letter-spacing: -0.3px; text-transform: uppercase; }
        
        .btn { background: var(--fg); color: var(--bg); border: 1px solid var(--fg); padding: 0.5rem 1rem; cursor: pointer; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; transition: 0.2s; }
        .btn:hover { background: var(--bg); color: var(--fg); }
        .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; }
        .btn-ghost:hover { border-color: var(--fg); }
        
        .form-panel { display: none; background: #fff; padding: 1.5rem; border: 1px solid var(--border); margin-top: 1rem; }
        input, select { width: 100%; padding: 0.6rem; margin-bottom: 1rem; border: 1px solid var(--border); font-size: 0.9rem; }
        input:focus { outline: none; border-color: var(--fg); }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #666; }
        .row { display: flex; gap: 1rem; } .col { flex: 1; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">Analyzer</div>
        
        <div class="nav-group">
            <a href="/" class="nav-title" style="text-decoration: none; display: block;">HOME</a>
        </div>
        
        <div class="nav-group">
            <a href="/credentials" class="nav-title" style="text-decoration: none; display: block;">CREDENTIALS</a>
        </div>

        <div class="nav-group">
            <div class="nav-title" onclick="toggleMenu('jira-menu')">JIRA <span id="jira-icon">+</span></div>
            <div class="submenu" id="jira-menu">
                <a href="/jira-stats" class="nav-item">General Stats</a>
                <a href="/compare" class="nav-item">Compare Projects</a>
            </div>
        </div>

        <div class="nav-group">
            <div class="nav-title" onclick="toggleMenu('conf-menu')">CONFLUENCE <span id="conf-icon">+</span></div>
            <div class="submenu" id="conf-menu">
                <a href="/confluence-stats" class="nav-item">General Stats</a>
                <a href="/confluence-compare" class="nav-item">Compare Spaces</a>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <h1>Credentials Vault</h1>

        <div class="card">
            <div class="card-header"><div class="card-title">Default Cloud Identity</div><button class="btn" onclick="toggleForm('def-form')">Configure</button></div>
            <div id="def-status" style="font-size:0.85rem; color:#666;">Not configured</div>
            <div id="def-form" class="form-panel">
                <label>Email Address</label><input id="def-email"><label>Atlassian API Token</label><input id="def-token" type="password">
                <div style="text-align:right"><button class="btn btn-ghost" onclick="toggleForm('def-form')">Cancel</button><button class="btn" onclick="saveDef()">Save</button></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><div class="card-title">Saved Cloud Sites</div><button class="btn" onclick="toggleForm('cloud-form')">Add Site</button></div>
            <div id="cloud-list" class="item-list"></div>
            <div id="cloud-form" class="form-panel">
                <div class="row"><div class="col"><label>Domain</label><input id="c-dom"></div><div class="col"><label>Email</label><input id="c-em"></div></div>
                <label>API Token</label><input id="c-tok" type="password">
                <div style="text-align:right"><button class="btn btn-ghost" onclick="toggleForm('cloud-form')">Cancel</button><button class="btn" onclick="addCloud()">Save</button></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><div class="card-title">Data Center Connections</div><button class="btn" onclick="toggleForm('dc-form')">Add Database</button></div>
            <div id="dc-list" class="item-list"></div>
            <div id="dc-form" class="form-panel">
                <div class="row"><div class="col"><label>Friendly Name</label><input id="dc-name"></div><div class="col" style="flex:0.3"><label>SSL?</label><input type="checkbox" id="dc-ssl" style="margin-top:10px"></div><div class="col"><label>Type</label><select id="dc-type"><option value="postgres">PostgreSQL</option><option value="mysql">MySQL</option></select></div></div>
                <div class="row"><div class="col" style="flex:2"><label>Host</label><input id="dc-host"></div><div class="col"><label>Port</label><input id="dc-port"></div><div class="col"><label>Database</label><input id="dc-db"></div></div>
                <div class="row"><div class="col"><label>User</label><input id="dc-user"></div><div class="col"><label>Password</label><input id="dc-pass" type="password"></div></div>
                <div style="display:flex; justify-content:space-between"><button class="btn btn-ghost" style="border:1px solid black" onclick="testDC()">Test Connection</button><div><button class="btn btn-ghost" onclick="toggleForm('dc-form')">Cancel</button><button class="btn" onclick="addDC()">Save</button></div></div>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu(id) { const el = document.getElementById(id); const icon = document.getElementById(id.split('-')[0] + '-icon'); if(el.classList.contains('open')) { el.classList.remove('open'); icon.innerText = '+'; } else { el.classList.add('open'); icon.innerText = '-'; } }
        const def = JSON.parse(localStorage.getItem('defaultCloudCreds') || '{}');
        let clouds = JSON.parse(localStorage.getItem('savedCloudSites') || '[]'); let dcs = JSON.parse(localStorage.getItem('savedDCConnections') || '[]');
        function init() { const status = document.getElementById('def-status'); if(def.email) { status.innerHTML = `Configured securely: <strong>${def.displayEmail || 'Hidden'}</strong>`; } renderLists(); }
        function toggleForm(id) { const el = document.getElementById(id); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
        async function getEncrypted(payload) { const res = await fetch('/api/encrypt', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({payload})}); return await res.json(); }
        async function saveDef() { const rawEmail = document.getElementById('def-email').value; const rawToken = document.getElementById('def-token').value; if(!rawEmail || !rawToken) return alert("Required fields missing"); const enc = await getEncrypted({ email: rawEmail, token: rawToken }); localStorage.setItem('defaultCloudCreds', JSON.stringify({ email: enc.email, token: enc.token, displayEmail: rawEmail })); location.reload(); }
        async function addCloud() { const domain = document.getElementById('c-dom').value; const rawEmail = document.getElementById('c-em').value; const rawToken = document.getElementById('c-tok').value; if(!domain || !rawEmail) return alert('Required fields missing'); const enc = await getEncrypted({ email: rawEmail, token: rawToken }); clouds.push({ domain, email: enc.email, token: enc.token, displayEmail: rawEmail }); localStorage.setItem('savedCloudSites', JSON.stringify(clouds)); toggleForm('cloud-form'); renderLists(); }
        async function testDC() { const config = await buildDCPayload(); try { const res = await fetch('/api/test-db', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(config)}); const d = await res.json(); alert(d.success ? 'Success' : 'Failed: '+d.error); } catch(e){ alert(e.message); } }
        async function addDC() { const config = await buildDCPayload(); dcs.push(config); localStorage.setItem('savedDCConnections', JSON.stringify(dcs)); toggleForm('dc-form'); renderLists(); }
        async function buildDCPayload() { const rawHost = document.getElementById('dc-host').value; const rawDb = document.getElementById('dc-db').value; const rawUser = document.getElementById('dc-user').value; const rawPass = document.getElementById('dc-pass').value; const enc = await getEncrypted({ host: rawHost, database: rawDb, user: rawUser, password: rawPass }); return { name: document.getElementById('dc-name').value, type: document.getElementById('dc-type').value, port: document.getElementById('dc-port').value, ssl: document.getElementById('dc-ssl').checked, host: enc.host, database: enc.database, user: enc.user, password: enc.password, displayHost: rawHost }; }
        function remove(type, i) { if(!confirm('Delete?')) return; if(type==='c') { clouds.splice(i,1); localStorage.setItem('savedCloudSites', JSON.stringify(clouds)); } else { dcs.splice(i,1); localStorage.setItem('savedDCConnections', JSON.stringify(dcs)); } renderLists(); }
        function renderLists() { document.getElementById('cloud-list').innerHTML = clouds.map((s,i) => `<div class="item"><div><b>${s.domain}</b> (${s.displayEmail || 'Encrypted'})</div><button class="btn btn-ghost" onclick="remove('c',${i})">Remove</button></div>`).join(''); document.getElementById('dc-list').innerHTML = dcs.map((s,i) => `<div class="item"><div><b>${s.name}</b> (${s.displayHost || 'Encrypted'})</div><button class="btn btn-ghost" onclick="remove('d',${i})">Remove</button></div>`).join(''); }
        init();
    </script>
</body>
</html>
