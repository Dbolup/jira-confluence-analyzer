<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Credentials Manager</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; background: #f8fafc; padding: 2rem; color:#334155; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 3rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { font-size: 1.8rem; color: #1e293b; margin-bottom: 2rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 1rem; }
        .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; background: #fff; transition: 0.2s; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .card-title { font-weight: 700; font-size: 1.1rem; }
        .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-primary { background: #3b82f6; color: white; } .btn-primary:hover { background: #2563eb; }
        .btn-success { background: #10b981; color: white; } .btn-success:hover { background: #059669; }
        .btn-danger { background: #fee2e2; color: #ef4444; } .btn-danger:hover { background: #fecaca; }
        .btn-ghost { background: transparent; color: #64748b; } .btn-ghost:hover { color: #334155; }
        .item-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; background: #f8fafc; border-radius: 8px; border: 1px solid #f1f5f9; }
        .form-panel { display: none; background: #f8fafc; padding: 1.5rem; border-radius: 12px; border: 1px solid #e2e8f0; margin-top: 1rem; }
        input, select { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #cbd5e1; border-radius: 6px; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; color: #475569; }
        .row { display: flex; gap: 1rem; } .col { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
            <a href="/" class="btn btn-ghost">⬅ Back to Dashboard</a>
            <h2 style="margin:0">Credentials Vault</h2>
        </div>

        <div class="card">
            <div class="card-header"><div class="card-title">☁️ Default Cloud Identity</div><button class="btn btn-primary" onclick="toggleForm('def-form')">Configure</button></div>
            <div id="def-status" style="font-size:0.9rem; color:#64748b;">Not configured</div>
            <div id="def-form" class="form-panel">
                <label>Email Address</label><input id="def-email"><label>Atlassian API Token</label><input id="def-token" type="password">
                <div style="text-align:right"><button class="btn btn-ghost" onclick="toggleForm('def-form')">Cancel</button><button class="btn btn-success" onclick="saveDef()">Save Securely</button></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><div class="card-title">🌐 Saved Cloud Sites</div><button class="btn btn-primary" onclick="toggleForm('cloud-form')">+ Add Site</button></div>
            <div id="cloud-list" class="item-list"></div>
            <div id="cloud-form" class="form-panel">
                <div class="row"><div class="col"><label>Domain</label><input id="c-dom"></div><div class="col"><label>Email</label><input id="c-em"></div></div>
                <label>API Token</label><input id="c-tok" type="password">
                <div style="text-align:right"><button class="btn btn-ghost" onclick="toggleForm('cloud-form')">Cancel</button><button class="btn btn-success" onclick="addCloud()">Save Securely</button></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><div class="card-title">🏢 Data Center Connections</div><button class="btn btn-primary" onclick="toggleForm('dc-form')">+ Add Database</button></div>
            <div id="dc-list" class="item-list"></div>
            <div id="dc-form" class="form-panel">
                <div class="row"><div class="col"><label>Friendly Name</label><input id="dc-name"></div><div class="col" style="flex:0.3"><label>SSL?</label><input type="checkbox" id="dc-ssl" style="margin-top:10px"></div><div class="col"><label>Type</label><select id="dc-type"><option value="postgres">PostgreSQL</option><option value="mysql">MySQL</option></select></div></div>
                <div class="row"><div class="col" style="flex:2"><label>Host</label><input id="dc-host"></div><div class="col"><label>Port</label><input id="dc-port"></div><div class="col"><label>Database</label><input id="dc-db"></div></div>
                <div class="row"><div class="col"><label>User</label><input id="dc-user"></div><div class="col"><label>Password</label><input id="dc-pass" type="password"></div></div>
                <div style="display:flex; justify-content:space-between"><button class="btn" style="background:#f59e0b; color:white" onclick="testDC()">🔌 Test Connection</button><div><button class="btn btn-ghost" onclick="toggleForm('dc-form')">Cancel</button><button class="btn btn-success" onclick="addDC()">Save Securely</button></div></div>
            </div>
        </div>
    </div>

    <script>
        const def = JSON.parse(localStorage.getItem('defaultCloudCreds') || '{}');
        let clouds = JSON.parse(localStorage.getItem('savedCloudSites') || '[]');
        let dcs = JSON.parse(localStorage.getItem('savedDCConnections') || '[]');

        function init() {
            const status = document.getElementById('def-status');
            if(def.email) {
                status.innerHTML = `✅ Configured securely. <strong>(${def.displayEmail || 'Hidden'})</strong>`; 
                status.style.color = '#10b981';
            } else status.innerHTML = '⚠️ No default identity set.';
            renderLists();
        }

        function toggleForm(id) { const el = document.getElementById(id); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
        
        async function getEncrypted(payload) {
            const res = await fetch('/api/encrypt', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({payload})});
            return await res.json();
        }

        async function saveDef() { 
            const rawEmail = document.getElementById('def-email').value;
            const rawToken = document.getElementById('def-token').value;
            if(!rawEmail || !rawToken) return alert("Required fields missing");

            const enc = await getEncrypted({ email: rawEmail, token: rawToken });
            localStorage.setItem('defaultCloudCreds', JSON.stringify({ email: enc.email, token: enc.token, displayEmail: rawEmail })); 
            location.reload(); 
        }
        
        async function addCloud() {
            const domain = document.getElementById('c-dom').value;
            const rawEmail = document.getElementById('c-em').value;
            const rawToken = document.getElementById('c-tok').value;
            if(!domain || !rawEmail) return alert('Required fields missing');

            const enc = await getEncrypted({ email: rawEmail, token: rawToken });
            clouds.push({ domain, email: enc.email, token: enc.token, displayEmail: rawEmail });
            localStorage.setItem('savedCloudSites', JSON.stringify(clouds)); 
            toggleForm('cloud-form'); renderLists();
        }

        async function testDC() {
            const config = await buildDCPayload();
            try {
                const res = await fetch('/api/test-db', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(config)});
                const d = await res.json();
                alert(d.success ? '✅ Success' : '❌ Failed: '+d.error);
            } catch(e){ alert(e.message); }
        }

        async function addDC() {
            const config = await buildDCPayload();
            dcs.push(config);
            localStorage.setItem('savedDCConnections', JSON.stringify(dcs)); toggleForm('dc-form'); renderLists();
        }

        async function buildDCPayload() {
            const rawHost = document.getElementById('dc-host').value;
            const rawDb = document.getElementById('dc-db').value;
            const rawUser = document.getElementById('dc-user').value;
            const rawPass = document.getElementById('dc-pass').value;

            const enc = await getEncrypted({ host: rawHost, database: rawDb, user: rawUser, password: rawPass });

            return {
                name: document.getElementById('dc-name').value, type: document.getElementById('dc-type').value, port: document.getElementById('dc-port').value, ssl: document.getElementById('dc-ssl').checked,
                host: enc.host, database: enc.database, user: enc.user, password: enc.password, displayHost: rawHost
            };
        }

        function remove(type, i) { if(!confirm('Delete?')) return; if(type==='c') { clouds.splice(i,1); localStorage.setItem('savedCloudSites', JSON.stringify(clouds)); } else { dcs.splice(i,1); localStorage.setItem('savedDCConnections', JSON.stringify(dcs)); } renderLists(); }

        function renderLists() {
            document.getElementById('cloud-list').innerHTML = clouds.map((s,i) => `<div class="item"><div><b>${s.domain}</b> (${s.displayEmail || 'Encrypted'})</div><button class="btn btn-danger" onclick="remove('c',${i})">X</button></div>`).join('');
            document.getElementById('dc-list').innerHTML = dcs.map((s,i) => `<div class="item"><div><b>${s.name}</b> (${s.displayHost || 'Encrypted'})</div><button class="btn btn-danger" onclick="remove('d',${i})">X</button></div>`).join('');
        }
        init();
    </script>
</body>
</html>
