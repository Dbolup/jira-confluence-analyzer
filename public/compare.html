<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jira Project Comparison</title>
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; background: #f1f5f9; padding: 2rem; color:#1e293b; }
        .container { max-width: 1400px; margin: 0 auto; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { text-align: center; color: #3b82f6; margin-bottom: 2rem; }
        
        .nav { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .nav a { padding: 0.8rem 1.5rem; background: #e2e8f0; color: #64748b; text-decoration: none; border-radius: 8px; font-weight: 600; transition: 0.2s; }
        .nav a:hover { background: #cbd5e1; }
        .nav a.active { background: #3b82f6; color: white; }

        .row-card { background: #f8fafc; padding: 1rem; border-radius: 8px; display: flex; gap: 1rem; margin-bottom: 1rem; border:1px solid #e2e8f0; align-items: flex-end; }
        select, input { width: 100%; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        
        .btn { padding: 0.8rem 1.5rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-add { background: #10b981; } .btn-add:hover { background: #059669; }
        .btn-run { background: #3b82f6; } .btn-run:hover { background: #2563eb; }
        .btn-del { background: #ef4444; padding: 0.8rem; } .btn-del:hover { background: #dc2626; }
        .btn-print { background: #64748b; margin-left: auto; }

        .table-wrapper { overflow-x: auto; margin-top: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 1rem; border-bottom: 1px solid #e2e8f0; text-align: center; vertical-align: top; }
        th { background: #3b82f6; color: white; min-width: 200px; } 
        td:first-child { text-align: left; background: #f8fafc; font-weight: 600; color: #334155; position: sticky; left: 0; z-index: 10; border-right: 2px solid #e2e8f0; }
        
        .metric-value { color: #2563eb; font-weight: 500; }
        .more-link { color: #3b82f6; font-size: 0.8rem; font-weight: bold; cursor: pointer; display: block; margin-top: 8px; background:#eff6ff; padding:4px; border-radius:4px; border:1px solid #dbeafe; }
        .more-link:hover { background: #3b82f6; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Jira Project Comparison</h1>
        <div class="nav">
            <a href="/">🏠 Home</a>
            <a href="/jira-stats">📊 Stats</a>
            <a href="/compare" class="active">🔄 Compare</a>
        </div>

        <div id="rows-container"></div>
        
        <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
            <button class="btn btn-add" onclick="addRow()">➕ Add Project</button>
            <button class="btn btn-run" onclick="runCompare()">🔍 Run Comparison</button>
            <button class="btn btn-print" onclick="window.print()">📄 Print / PDF</button>
        </div>

        <div id="results-area"></div>
    </div>

    <script>
        const defCreds = JSON.parse(localStorage.getItem('defaultCloudCreds') || '{}');
        const cloudSites = JSON.parse(localStorage.getItem('savedCloudSites') || '[]');
        const dcConns = JSON.parse(localStorage.getItem('savedDCConnections') || '[]');

        addRow(); addRow();

        function addRow() {
            const div = document.createElement('div');
            div.className = 'row-card';
            
            let opts = '<option value="">-- Select Source --</option>';
            if(cloudSites.length) { opts += '<optgroup label="Saved Cloud">'; cloudSites.forEach((s,i)=>opts+=`<option value="c-${i}">☁️ ${s.domain}</option>`); opts += '</optgroup>'; }
            if(dcConns.length) { opts += '<optgroup label="Data Center">'; dcConns.forEach((s,i)=>opts+=`<option value="d-${i}">🏢 ${s.name}</option>`); opts += '</optgroup>'; }
            
            div.innerHTML = `
                <div style="flex:1">
                    <label>Source</label>
                    <select class="src-select" onchange="loadProjs(this)">${opts}<option value="manual">➕ Manual Cloud Domain...</option></select>
                    <input class="man-dom" placeholder="domain (using default creds)" style="display:none; margin-top:5px" onblur="loadProjs(this.previousElementSibling)">
                </div>
                <div style="flex:1.5">
                    <label>Project</label>
                    <select class="p-select" disabled><option>Select source first...</option></select>
                </div>
                <button class="btn btn-del" onclick="this.parentElement.remove()">✕</button>
            `;
            document.getElementById('rows-container').appendChild(div);
        }

        async function loadProjs(el) {
            const val = el.value;
            const manInp = el.nextElementSibling;
            const pSel = el.parentElement.nextElementSibling.querySelector('select');
            
            let config = {};

            if(val === 'manual') {
                manInp.style.display = 'block';
                if(!manInp.value) return; 
                if(!defCreds.email) return alert('Save default creds first');
                config = { type:'cloud', domain: manInp.value, email: defCreds.email, token: defCreds.token };
            } else {
                manInp.style.display = 'none';
                if(!val) { pSel.disabled=true; return; }
                const [type, idx] = val.split('-');
                if(type==='c') { const c = cloudSites[idx]; config = { type:'cloud', ...c }; }
                else { const d = dcConns[idx]; config = { type:'dc', ...d }; }
            }

            pSel.innerHTML = '<option>Loading...</option>';
            try {
                const res = await fetch('/api/projects', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sources: [config] })
                });
                const data = await res.json();
                
                if(data.results[0].error) throw new Error(data.results[0].error);

                let html = '<option value="">-- Select Project --</option>';
                data.results[0].projects.forEach(p => {
                    html += `<option value="${p.key}" data-id="${p.id}" data-src='${JSON.stringify(config)}'>${p.name} (${p.key})</option>`;
                });
                pSel.innerHTML = html;
                pSel.disabled = false;
            } catch(e) { 
                pSel.innerHTML = `<option>Error: ${e.message}</option>`; 
            }
        }

        async function runCompare() {
            const selection = [];
            document.querySelectorAll('.p-select').forEach(s => {
                if(s.value && !s.disabled) {
                    const opt = s.options[s.selectedIndex];
                    selection.push({
                        source: JSON.parse(opt.dataset.src),
                        projectKey: s.value,
                        projectId: opt.dataset.id
                    });
                }
            });

            if(!selection.length) return alert("Please select at least one project");

            const btn = document.querySelector('.btn-run');
            const oldText = btn.innerText;
            btn.innerText = 'Processing...'; btn.disabled = true;
            
            const area = document.getElementById('results-area');
            area.innerHTML = '';

            try {
                const res = await fetch('/api/compare-projects', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ selection })
                });
                const data = await res.json();

                // Detailed Metrics (Including Missing Schemes)
                const metrics = [
                    ['name', '📝 Project Name'],
                    ['lead', '👤 Project Lead'],
                    ['issueCount', '🎫 Issue Count'],
                    ['componentCount', '🧩 Components'],
                    ['workflowScheme', '🔄 Workflow Scheme'],
                    ['issueTypeScheme', '📋 Issue Type Scheme'],
                    ['priorityScheme', '🎯 Priority Scheme'],
                    ['fieldConfiguration', '⚙️ Field Config'],
                    ['permissionScheme', '🔐 Permission Scheme'],
                    ['notificationScheme', '📧 Notification Scheme'],
                    ['screenScheme', '🖼️ Screen Scheme'],
                    ['issueTypeScreenScheme', '📱 Issue Type Screen Scheme'],
                    ['statuses', '📊 Statuses']
                ];

                let html = '<div class="table-wrapper"><table><thead><tr><th>Metric</th>';
                data.results.forEach(r => {
                    // FIX: Ensure header is never undefined. Use r.source string.
                    const title = r.source.domain || r.source.name || r.source || "Unknown";
                    html += `<th>${title}<br><span style="font-size:0.8em; opacity:0.8">${r.key} (${r.type})</span></th>`;
                });
                html += '</tr></thead><tbody>';

                metrics.forEach(([key, label]) => {
                    html += `<tr><td>${label}</td>` + 
                    data.results.map(r => {
                        if(r.error) return `<td style="color:red">Error</td>`;
                        
                        let val = r[key] || '-';
                        
                        // Handle Long Statuses
                        if(key === 'statuses' && val.length > 60) {
                            const uid = 's' + Math.random().toString(36).substr(2,9);
                            const short = val.substring(0, 60);
                            return `<td>
                                <span id="short-${uid}">${short}...</span>
                                <span id="full-${uid}" style="display:none">${val}</span>
                                <div onclick="toggleText('${uid}')" class="more-link" id="btn-${uid}">View More</div>
                            </td>`;
                        }
                        
                        return `<td><span class="metric-value">${val}</span></td>`;
                    }).join('') + '</tr>';
                });

                area.innerHTML = html + '</tbody></table></div>';
            } catch(e) { alert(e.message); }
            
            btn.innerText = oldText; btn.disabled = false;
        }

        function toggleText(id) {
            const shortSpan = document.getElementById('short-' + id);
            const fullSpan = document.getElementById('full-' + id);
            const btn = document.getElementById('btn-' + id);

            if(fullSpan.style.display === 'none') {
                fullSpan.style.display = 'inline';
                shortSpan.style.display = 'none';
                btn.innerText = 'Show Less';
            } else {
                fullSpan.style.display = 'none';
                shortSpan.style.display = 'inline';
                btn.innerText = 'View More';
            }
        }
    </script>
</body>
</html>
