
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Comparison</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #1c1e21;
        padding: 2rem;
        min-height: 100vh;
        position: relative;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="1" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
        pointer-events: none;
        z-index: -1;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        padding: 3rem;
        animation: slideUp 0.6s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        font-weight: 700;
        font-size: 2.5rem;
        text-align: center;
        margin-bottom: 1rem;
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        position: relative;
      }

      h1::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 4px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        border-radius: 2px;
      }

      .nav-buttons {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 3rem;
      }

      .nav-btn {
        padding: 0.8rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }

      .nav-btn.active {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
      }

      .nav-btn.inactive {
        background: #f1f5f9;
        color: #64748b;
      }

      .nav-btn.inactive:hover {
        background: #e2e8f0;
        transform: translateY(-2px);
      }

      .site-form {
        display: flex;
        flex-direction: column;
        margin-bottom: 3rem;
      }

      .site-block {
        background: white;
        border: 2px solid #f0f0f0;
        border-radius: 16px;
        padding: 2rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
      }

      .site-block:hover {
        border-color: #667eea;
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(102, 126, 234, 0.15);
      }

      .input-group {
        margin-bottom: 1.5rem;
      }

      label {
        font-weight: 600;
        font-size: 0.95rem;
        color: #374151;
        display: block;
        margin-bottom: 0.5rem;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"],
      select {
        width: 100%;
        padding: 1rem;
        font-size: 1rem;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        transition: all 0.3s ease;
        background: #fafafa;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .button-group {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
      }

      button {
        padding: 1rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn-submit {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        flex: 1;
      }

      .btn-submit:hover {
        background: linear-gradient(135deg, #5a67d8, #6b46c1);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
      }

      .btn-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255,255,255,.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s ease-in-out infinite;
        margin-right: 0.5rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .comparison-container {
        margin-top: 3rem;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.5s ease;
      }

      .comparison-container.show {
        opacity: 1;
        transform: translateY(0);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      th, td {
        text-align: left;
        padding: 1.2rem;
        border-bottom: 1px solid #f1f5f9;
        font-size: 0.95rem;
      }

      th {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
      }

      tr:hover td {
        background-color: #f8fafc;
      }

      .metric-label {
        font-weight: 600;
        color: #374151;
        background: #f8fafc;
      }

      .metric-value {
        font-weight: 500;
        color: #667eea;
      }

      .error {
        color: #ef4444;
        font-weight: 500;
      }

      .project-selector {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }

      @media (max-width: 768px) {
        body {
          padding: 1rem;
        }

        .container {
          padding: 2rem;
        }

        h1 {
          font-size: 2rem;
        }

        .project-selector {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Project Comparison</h1>
      
      <div class="nav-buttons">
        <a href="/" class="nav-btn inactive">📊 Basic Stats</a>
        <a href="/insights" class="nav-btn inactive">🔍 Detailed Insights</a>
        <div class="nav-btn active">🔄 Compare Projects</div>
      </div>

      <form class="site-form" id="site-form">
        <div id="site-inputs"></div>
        <div class="button-group">
          <button type="submit" class="btn-submit" id="load-btn">
            📂 Load Projects
          </button>
        </div>
      </form>

      <div id="project-selection" style="display: none;">
        <h2 style="color: #374151; margin-bottom: 1.5rem;">Select Projects to Compare</h2>
        <div class="project-selector" id="project-selectors"></div>
        <div class="button-group">
          <button type="button" class="btn-submit" onclick="compareProjects()">
            🔍 Compare Selected Projects
          </button>
        </div>
      </div>

      <div class="comparison-container" id="comparison-container">
        <table id="comparison-table"></table>
      </div>
    </div>

    <script>
      let siteCounter = 0;
      let sitesData = [];
      let projectsData = {};

      function addSiteInput() {
        const container = document.getElementById('site-inputs');
        const div = document.createElement('div');
        div.className = 'site-block';

        div.innerHTML = `
          <div class="input-group">
            <label>🌐 Site URL (e.g. mysite.atlassian.net)</label>
            <input type="text" name="domain-${siteCounter}" placeholder="mycompany.atlassian.net" required />
          </div>

          <div class="input-group">
            <label>📧 Email</label>
            <input type="email" name="email-${siteCounter}" placeholder="your.email@company.com" required />
          </div>

          <div class="input-group">
            <label>🔑 API Token</label>
            <input type="password" name="token-${siteCounter}" placeholder="Your API token" required />
          </div>
        `;

        container.appendChild(div);
        siteCounter++;
      }

      document.getElementById('site-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const loadBtn = document.getElementById('load-btn');
        const originalText = loadBtn.innerHTML;

        loadBtn.disabled = true;
        loadBtn.innerHTML = '<span class="loading"></span>Loading Projects...';

        sitesData = [];
        for (let i = 0; i < siteCounter; i++) {
          const domain = document.querySelector(`[name="domain-${i}"]`).value
            .replace(/^https?:\/\//, '')
            .replace(/\/$/, '')
            .replace('.atlassian.net', '');
          const email = document.querySelector(`[name="email-${i}"]`).value;
          const token = document.querySelector(`[name="token-${i}"]`).value;
          sitesData.push({ domain, email, token });
        }

        try {
          const res = await fetch('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sites: sitesData })
          });

          const data = await res.json();
          projectsData = data;
          renderProjectSelectors(data);
          document.getElementById('project-selection').style.display = 'block';
        } catch (error) {
          alert('Error loading projects: ' + error.message);
        } finally {
          loadBtn.disabled = false;
          loadBtn.innerHTML = originalText;
        }
      });

      function renderProjectSelectors(data) {
        const container = document.getElementById('project-selectors');
        container.innerHTML = '';

        data.results.forEach((siteData, index) => {
          const div = document.createElement('div');
          div.className = 'input-group';
          
          let options = '<option value="">-- Select a project --</option>';
          if (siteData.projects && siteData.projects.length > 0) {
            options += siteData.projects.map(p => 
              `<option value="${p.key}">${p.name} (${p.key})</option>`
            ).join('');
          }

          div.innerHTML = `
            <label>📋 ${siteData.domain}</label>
            <select id="project-select-${index}">
              ${options}
            </select>
          `;
          
          container.appendChild(div);
        });
      }

      async function compareProjects() {
        const selectedProjects = [];
        
        projectsData.results.forEach((siteData, index) => {
          const select = document.getElementById(`project-select-${index}`);
          const projectKey = select.value;
          
          if (projectKey) {
            const project = siteData.projects.find(p => p.key === projectKey);
            if (project) {
              selectedProjects.push({
                domain: siteData.domain,
                site: sitesData[index],
                project: project
              });
            }
          }
        });

        if (selectedProjects.length === 0) {
          alert('Please select at least one project to compare');
          return;
        }

        try {
          const res = await fetch('/api/compare-projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ projects: selectedProjects })
          });

          const data = await res.json();
          renderComparisonTable(data.results);
          document.getElementById('comparison-container').classList.add('show');
        } catch (error) {
          alert('Error comparing projects: ' + error.message);
        }
      }

      function renderComparisonTable(results) {
        const metrics = [
          ['name', '📝 Project Name'],
          ['key', '🔑 Project Key'],
          ['issueCount', '🎫 Number of Issues']
        ];

        let html = '<tr><th>Metric</th>' + 
          results.map(r => `<th>${r.domain}</th>`).join('') + '</tr>';

        for (const [key, label] of metrics) {
          html += `<tr><td class="metric-label">${label}</td>` + 
            results.map(r => {
              if (r.error) {
                return `<td class="error">${r.error}</td>`;
              }
              
              let value = r[key] ?? '-';
              
              return `<td><span class="metric-value">${value}</span></td>`;
            }).join('') + '</tr>';
        }

        document.getElementById('comparison-table').innerHTML = html;
      }

      // Load credentials from sessionStorage if available
      function loadStoredCredentials() {
        const stored = sessionStorage.getItem('atlassianCredentials');
        if (stored) {
          try {
            const sites = JSON.parse(stored);
            sites.forEach((site, index) => {
              if (index > 0) addSiteInput();
              
              document.querySelector(`[name="domain-${index}"]`).value = site.domain;
              document.querySelector(`[name="email-${index}"]`).value = site.email;
              document.querySelector(`[name="token-${index}"]`).value = site.token;
            });
          } catch (e) {
            console.warn('Failed to load stored credentials:', e);
          }
        }
      }

      // Add initial site input
      addSiteInput();
      
      // Load stored credentials
      setTimeout(loadStoredCredentials, 100);
    </script>
  </body>
</html>
