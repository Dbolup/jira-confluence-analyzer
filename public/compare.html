<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jira Comparison</title>
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; background: #f1f5f9; padding: 2rem; color:#1e293b; }
        .container { max-width: 1400px; margin: 0 auto; background: white; padding: 2rem; border-radius: 16px; }
        h1 { text-align: center; color: #3b82f6; }
        .nav { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .nav a { padding: 0.8rem 1.5rem; background: #e2e8f0; color: #64748b; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .active { background: #3b82f6; color: white; }
        .row-card { background: #f8fafc; padding: 1rem; border-radius: 8px; display: flex; gap: 1rem; margin-bottom: 1rem; border:1px solid #e2e8f0; }
        select, input { width: 100%; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; }
        .btn { padding: 0.8rem 1.5rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color:white; }
        .btn-add { background: #10b981; } .btn-run { background: #3b82f6; } .btn-del { background: #ef4444; }
        table { width: 100%; border-collapse: collapse; margin-top:2rem; }
        th, td { padding: 1rem; border-bottom: 1px solid #e2e8f0; text-align: center; vertical-align: top; }
        th { background: #3b82f6; color: white; } td:first-child { text-align: left; background: #f8fafc; font-weight: 600; }
        .more-link { color: #3b82f6; font-size: 0.8rem; font-weight: bold; cursor: pointer; display: block; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Jira Project Comparison</h1>
        <div class="nav">
            <a href="/">🏠 Home</a><a href="/jira-stats">📊 Stats</a><a href="/compare" class="active">🔄 Compare</a>
        </div>
        <div id="rows-container"></div>
        <div style="margin-top: 1.5rem;">
            <button class="btn btn-add" onclick="addRow()">➕ Add Project</button>
            <button class="btn btn-run" onclick="runCompare()">🔍 Run Comparison</button>
        </div>
        <div id="results-area"></div>
    </div>

    <script>
        const defCreds = JSON.parse(localStorage.getItem('defaultCloudCreds') || '{}');
        const cloudSites = JSON.parse(localStorage.getItem('savedCloudSites') || '[]');
        const dcConns = JSON.parse(localStorage.getItem('savedDCConnections') || '[]');
        addRow(); addRow();

        function addRow() {
            const div = document.createElement('div');
            div.className = 'row-card';
            let opts = '<option value="">-- Select Source --</option>';
            if(cloudSites.length) { opts += '<optgroup label="Saved Cloud">'; cloudSites.forEach((s,i)=>opts+=`<option value="c-${i}">☁️ ${s.domain}</option>`); opts += '</optgroup>'; }
            if(dcConns.length) { opts += '<optgroup label="Data Center">'; dcConns.forEach((s,i)=>opts+=`<option value="d-${i}">🏢 ${s.name}</option>`); opts += '</optgroup>'; }
            
            div.innerHTML = `
                <div style="flex:1">
                    <label>Source</label>
                    <select class="src-select" onchange="loadProjs(this)">${opts}<option value="manual">➕ Manual Cloud Domain...</option></select>
                    <input class="man-dom" placeholder="domain (using default creds)" style="display:none; margin-top:5px" onblur="loadProjs(this.previousElementSibling)">
                </div>
                <div style="flex:1.5"><label>Project</label><select class="p-select" disabled></select></div>
                <button class="btn btn-del" onclick="this.parentElement.remove()">✕</button>
            `;
            document.getElementById('rows-container').appendChild(div);
        }

        async function loadProjs(el) {
            const val = el.value;
            const manInp = el.nextElementSibling;
            const pSel = el.parentElement.nextElementSibling.querySelector('select');
            
            if(val === 'manual') {
                manInp.style.display = 'block';
                if(!manInp.value) return; // Wait for input
                if(!defCreds.email) return alert('Save default creds first');
                var config = { type:'cloud', domain: manInp.value, email: defCreds.email, token: defCreds.token };
            } else {
                manInp.style.display = 'none';
                if(!val) { pSel.disabled=true; return; }
                const [type, idx] = val.split('-');
                if(type==='c') { const c = cloudSites[idx]; var config = { type:'cloud', ...c }; }
                else { const d = dcConns[idx]; var config = { type:'dc', ...d }; }
            }

            pSel.innerHTML = '<option>Loading...</option>';
            try {
                const res = await fetch('/api/projects', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sources: [config] }) });
                const data = await res.json();
                let html = '<option value="">Select Project</option>';
                data.results[0].projects.forEach(p => html += `<option value="${p.key}" data-id="${p.id}" data-src='${JSON.stringify(config)}'>${p.name} (${p.key})</option>`);
                pSel.innerHTML = html; pSel.disabled = false;
            } catch(e) { pSel.innerHTML = '<option>Error</option>'; }
        }

        async function runCompare() {
            const btn = document.querySelector('.btn-run');
            btn.innerText = 'Processing...';
            const selection = [];
            document.querySelectorAll('.p-select').forEach(s => {
                if(s.value) selection.push({ source: JSON.parse(s.selectedOptions[0].dataset.src), projectKey: s.value, projectId: s.selectedOptions[0].dataset.id });
            });
            if(!selection.length) return alert('Select projects');
            
            const res = await fetch('/api/compare-projects', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ selection }) });
            const data = await res.json();
            
            const metrics = [['name','Name'],['lead','Lead'],['issueCount','Issues'],['componentCount','Components'],['workflowScheme','Workflow Scheme'],['issueTypeScheme','Issue Type Scheme'],['priorityScheme','Priority Scheme'],['statuses','Statuses']];
            let html = '<table><thead><tr><th>Metric</th>'+data.results.map(r=>`<th>${r.source.domain||r.source.name}<br>${r.key} (${r.type})</th>`).join('')+'</tr></thead><tbody>';
            metrics.forEach(([k,l]) => {
                html += `<tr><td>${l}</td>` + data.results.map(r => {
                    let val = r[k]||'-';
                    if(k==='statuses' && val.length>60) {
                        const id = Math.random().toString(36).substr(2,9);
                        return `<td><span id="s-${id}">${val.substring(0,60)}...</span><span id="f-${id}" style="display:none">${val}</span><div class="more-link" onclick="toggle('${id}')">View More</div></td>`;
                    }
                    return `<td>${val}</td>`;
                }).join('') + '</tr>';
            });
            document.getElementById('results-area').innerHTML = html + '</tbody></table>';
            btn.innerText = '🔍 Run Comparison';
        }
        window.toggle = id => {
            const s=document.getElementById('s-'+id), f=document.getElementById('f-'+id);
            if(f.style.display==='none'){ f.style.display='inline'; s.style.display='none'; } else { f.style.display='none'; s.style.display='inline'; }
        }
    </script>
</body>
</html>
