<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jira Compare</title>
    <style>
        :root { --bg: #ffffff; --fg: #000000; --border: #e5e5e5; --sidebar: #0a0a0a; --sidebar-text: #a3a3a3; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        body { display: flex; height: 100vh; background: var(--bg); color: var(--fg); overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--sidebar); display: flex; flex-direction: column; padding: 2.5rem 2rem; border-right: 1px solid #222; }
        .logo { color: #fff; font-size: 1.1rem; font-weight: 600; letter-spacing: 2px; margin-bottom: 3rem; text-transform: uppercase; }
        .nav-item { display: block; color: var(--sidebar-text); text-decoration: none; padding: 0.6rem 0; font-size: 0.9rem; transition: 0.2s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { color: #fff; }
        .nav-group { margin-bottom: 1.5rem; }
        .nav-title { display: flex; justify-content: space-between; color: #fff; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 0.6rem 0; cursor: pointer; border-bottom: 1px solid #333; margin-bottom: 0.5rem; }
        .submenu { display: none; padding-left: 0.5rem; }
        .submenu.open { display: block; }
        
        .main-content { flex: 1; overflow-y: auto; padding: 3rem 4rem; }
        h1 { font-size: 1.8rem; font-weight: 400; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; letter-spacing: -0.5px; }
        
        .btn { background: var(--fg); color: var(--bg); border: 1px solid var(--fg); padding: 0.6rem 1.2rem; cursor: pointer; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; transition: 0.2s; }
        .btn:hover { background: var(--bg); color: var(--fg); }
        .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; }
        .btn-ghost:hover { border-color: var(--fg); }
        
        .row-card { border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1rem; display: flex; gap: 1rem; align-items: flex-end; background: #fafafa; }
        label { display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; color: #666; }
        select, input { width: 100%; padding: 0.6rem; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 0.9rem; }
        select:focus, input:focus { outline: none; border-color: var(--fg); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 2rem; font-size: 0.85rem; }
        th, td { padding: 1rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
        th { font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.5px; color: #666; background: #fafafa; }
        td:first-child { font-weight: 600; border-right: 1px solid var(--border); width: 220px; background: #fafafa; color: #000; }
        .metric-value { font-family: monospace; font-size: 0.9rem; }
        .more-link { font-size: 0.75rem; text-decoration: underline; cursor: pointer; margin-top: 5px; display: inline-block; color: #666; }

        @media print {
            .sidebar, .no-print { display: none !important; }
            body { display: block; height: auto; overflow: visible; }
            .main-content { padding: 0; overflow: visible; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">DRFT</div>
        
        <div class="nav-group">
            <a href="/" class="nav-title" style="text-decoration: none; display: block;">HOME</a>
        </div>
        
        <div class="nav-group">
            <a href="/credentials" class="nav-title" style="text-decoration: none; display: block;">CREDENTIALS</a>
        </div>

        <div class="nav-group">
            <a href="/discovery" class="nav-title" style="text-decoration: none; display: block;">DISCOVERY</a>
        </div>

        <div class="nav-group">
            <div class="nav-title" onclick="toggleMenu('jira-menu')">JIRA <span id="jira-icon">+</span></div>
            <div class="submenu" id="jira-menu">
                <a href="/jira-stats" class="nav-item">General Stats</a>
                <a href="/compare" class="nav-item">Compare Projects</a>
            </div>
        </div>

        <div class="nav-group">
            <div class="nav-title" onclick="toggleMenu('conf-menu')">CONFLUENCE <span id="conf-icon">+</span></div>
            <div class="submenu" id="conf-menu">
                <a href="/confluence-stats" class="nav-item">General Stats</a>
                <a href="/confluence-compare" class="nav-item">Compare Spaces</a>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <h1>Jira Project Comparison</h1>
        <div id="rows-container" class="no-print"></div>
        <div class="no-print" style="margin-top: 1.5rem; display: flex; gap: 1rem;">
            <button class="btn btn-ghost" style="border:1px solid #000" onclick="addRow()">Add Project</button>
            <button class="btn" onclick="runCompare()">Run Comparison</button>
            <button class="btn btn-ghost" style="margin-left:auto" onclick="window.print()">Print / PDF</button>
        </div>
        <div id="results-area"></div>
    </div>

    <script src="/js/modal.js"></script>
    <script>
        function toggleMenu(id) { const el = document.getElementById(id); const icon = document.getElementById(id.split('-')[0] + '-icon'); if(el.classList.contains('open')) { el.classList.remove('open'); icon.innerText = '+'; } else { el.classList.add('open'); icon.innerText = '-'; } }
        
        const defCreds = JSON.parse(localStorage.getItem('defaultCloudCreds') || '{}');
        const cloudSites = JSON.parse(localStorage.getItem('savedCloudSites') || '[]');
        const dcConns = JSON.parse(localStorage.getItem('savedDCConnections') || '[]');
        addRow(); addRow();

        function addRow() {
            const div = document.createElement('div'); div.className = 'row-card';
            let opts = '<option value="">-- Select Source --</option>';
            if(cloudSites.length) { opts += '<optgroup label="Saved Cloud">'; cloudSites.forEach((s,i)=>opts+=`<option value="c-${i}">${s.domain}</option>`); opts += '</optgroup>'; }
            if(dcConns.length) { opts += '<optgroup label="Data Center">'; dcConns.forEach((s,i)=>opts+=`<option value="d-${i}">${s.name}</option>`); opts += '</optgroup>'; }
            
            div.innerHTML = `<div style="flex:1"><label>Source</label><select class="src-select" onchange="loadProjs(this)">${opts}<option value="manual">Manual Cloud Domain...</option></select><input class="man-dom" placeholder="domain (uses default creds)" style="display:none;margin-top:5px" onblur="loadProjs(this.previousElementSibling)"></div><div style="flex:1.5"><label>Project</label><select class="p-select" disabled><option>Select source first...</option></select></div><button class="btn btn-ghost" onclick="this.parentElement.remove()">✕</button>`;
            document.getElementById('rows-container').appendChild(div);
        }

        async function loadProjs(el) {
            const val = el.value; const manInp = el.nextElementSibling; const pSel = el.parentElement.nextElementSibling.querySelector('select');
            let config = {};
            if(val === 'manual') { manInp.style.display = 'block'; if(!manInp.value) return; if(!defCreds.email) return showAlert('Save default creds first'); config = { type:'cloud', domain: manInp.value, email: defCreds.email, token: defCreds.token }; } 
            else { 
                manInp.style.display = 'none'; 
                if(!val) { pSel.disabled=true; return; } 
                const [type, idx] = val.split('-'); 
                if(type==='c') { 
                    config = { type: 'cloud', domain: cloudSites[idx].domain, email: cloudSites[idx].email, token: cloudSites[idx].token }; 
                } else { 
                    config = { type: dcConns[idx].type, name: dcConns[idx].name, host: dcConns[idx].host, database: dcConns[idx].database, user: dcConns[idx].user, password: dcConns[idx].password, port: dcConns[idx].port, ssl: dcConns[idx].ssl };
                } 
            }

            pSel.innerHTML = '<option>Loading...</option>';
            try {
                const res = await fetch('/api/projects', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ sources: [config] }) });
                const data = await res.json();
                let html = '<option value="">-- Select Project --</option>';
                data.results[0].projects.forEach(p => { html += `<option value="${p.key}" data-id="${p.id}" data-src='${JSON.stringify(config)}'>${p.name} (${p.key})</option>`; });
                pSel.innerHTML = html; pSel.disabled = false;
            } catch(e) { pSel.innerHTML = `<option>Error: ${e.message}</option>`; }
        }

        async function runCompare() {
            const selection = [];
            document.querySelectorAll('.p-select').forEach(s => { if(s.value && !s.disabled) { const opt = s.options[s.selectedIndex]; selection.push({ source: JSON.parse(opt.dataset.src), projectKey: s.value, projectId: opt.dataset.id }); } });
            if(!selection.length) return showAlert("Please select at least one project");

            const btn = document.querySelector('.btn'); const oldText = btn.innerText; btn.innerText = 'Processing...'; btn.disabled = true;
            const area = document.getElementById('results-area'); area.innerHTML = '';

            try {
                const res = await fetch('/api/compare-projects', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ selection }) });
                const data = await res.json();

                const metrics = [
                    ['name', 'Project Name'], ['lead', 'Project Lead'], ['issueCount', 'Issue Count'], ['componentCount', 'Components'],
                    ['workflowScheme', 'Workflow Scheme'], ['issueTypeScheme', 'Issue Type Scheme'], ['priorityScheme', 'Priority Scheme'], 
                    ['fieldConfiguration', 'Field Configuration'], ['permissionScheme', 'Permission Scheme'], ['notificationScheme', 'Notification Scheme'],
                    ['issueTypeScreenScheme', 'Screen Scheme'], ['statuses', 'Statuses']
                ];

                let html = '<div class="table-wrapper"><table><thead><tr><th>Metric</th>';
                data.results.forEach(r => { const title = r.source.domain || r.source.name || r.source || "Unknown"; html += `<th>${title}<br><span style="font-weight:400; font-size:0.8em; color:#666">${r.key} (${r.type})</span></th>`; });
                html += '</tr></thead><tbody>';

                metrics.forEach(([key, label]) => {
                    html += `<tr><td>${label}</td>` + data.results.map(r => {
                        if(r.error) return `<td style="color:red">Error</td>`;
                        let val = r[key] || '-';
                        if(val === 'Skipped' || val === 'Skipped (DC)') return `<td style="color:#aaa; font-style:italic">Skipped (DC)</td>`;
                        if(key === 'statuses' && val.length > 60) {
                            const uid = 's' + Math.random().toString(36).substr(2,9);
                            return `<td><span id="short-${uid}" class="metric-value">${val.substring(0,60)}...</span><span id="full-${uid}" class="metric-value" style="display:none">${val}</span><div onclick="toggleText('${uid}')" class="more-link">Expand</div></td>`;
                        }
                        return `<td><span class="metric-value">${val}</span></td>`;
                    }).join('') + '</tr>';
                });
                area.innerHTML = html + '</tbody></table></div>';
            } catch(e) { showAlert(e.message); }
            btn.innerText = oldText; btn.disabled = false;
        }

        function toggleText(id) {
            const shortSpan = document.getElementById('short-' + id); const fullSpan = document.getElementById('full-' + id);
            if(fullSpan.style.display === 'none') { fullSpan.style.display = 'inline'; shortSpan.style.display = 'none'; }
            else { fullSpan.style.display = 'none'; shortSpan.style.display = 'inline'; }
        }
    </script>
</body>
</html>
