<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confluence Stats</title>
    <style>
      body { margin: 0; font-family: -apple-system, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem; color: #1c1e21; }
      .container { max-width: 1200px; margin: 0 auto; background: rgba(255,255,255,0.95); padding: 3rem; border-radius: 20px; }
      h1 { text-align: center; color: #4c1d95; }
      .nav-buttons { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
      .nav-btn { padding: 0.8rem 1.5rem; background: #f1f5f9; color: #64748b; border-radius: 12px; text-decoration: none; font-weight: 600; }
      .active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
      .site-block { background: white; border: 2px solid #f0f0f0; padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; }
      select { width: 100%; padding: 1rem; border: 2px solid #e2e8f0; border-radius: 8px; }
      .btn { padding: 1rem 2rem; border: none; border-radius: 12px; cursor: pointer; color: white; font-weight: bold; }
      .btn-add { background: #10b981; } .btn-go { background: #667eea; } .btn-up { background: #f59e0b; } .btn-clr { background: #ef4444; }
      table { width: 100%; margin-top: 2rem; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
      th, td { padding: 1rem; border-bottom: 1px solid #f1f5f9; text-align: center; }
      th { background: #667eea; color: white; } td:first-child { text-align: left; font-weight: 600; background: #f8fafc; }
    </style>
</head>
<body>
    <div class="container">
      <h1>Confluence Stats</h1>
      <div class="nav-buttons">
        <a href="/" class="nav-btn">🏠 Home</a><a href="/confluence-stats" class="nav-btn active">📊 Stats</a><a href="/confluence-compare" class="nav-btn">⚖️ Compare</a>
      </div>
      
      <div id="site-inputs"></div>
      <input type="file" id="up" accept=".json" style="display:none" onchange="loadFile(this)">
      
      <div style="display:flex; gap:1rem; margin-top:1rem">
        <button class="btn btn-add" onclick="addInput()">➕ Add Source</button>
        <button class="btn btn-up" onclick="document.getElementById('up').click()">📂 Upload State</button>
        <button class="btn btn-go" style="flex:2" onclick="run()">📊 Analyze</button>
        <button class="btn btn-clr" onclick="reset()">🗑️ Clear</button>
      </div>
      <div id="table-area"></div>
    </div>

    <script>
      let globalData = [];
      const cloudSites = JSON.parse(localStorage.getItem('savedCloudSites') || '[]');
      const dcConns = JSON.parse(localStorage.getItem('savedDCConnections') || '[]');

      addInput();

      function addInput() {
        if(cloudSites.length===0 && dcConns.length===0) return window.location.href='/credentials';
        const div = document.createElement('div');
        div.className = 'site-block';
        let opts = '<option value="">-- Select Source --</option>';
        if(cloudSites.length) { opts += '<optgroup label="Cloud">'; cloudSites.forEach((s,i)=>opts+=`<option value="cloud-${i}">☁️ ${s.domain}</option>`); opts += '</optgroup>'; }
        if(dcConns.length) { opts += '<optgroup label="Data Center">'; dcConns.forEach((s,i)=>opts+=`<option value="dc-${i}">🏢 ${s.name}</option>`); opts += '</optgroup>'; }
        div.innerHTML = `<select class="src-select">${opts}</select>`;
        document.getElementById('site-inputs').appendChild(div);
      }

      function reset() { globalData=[]; document.getElementById('table-area').innerHTML=''; document.getElementById('site-inputs').innerHTML=''; addInput(); }

      function loadFile(input) {
          const reader = new FileReader();
          reader.onload = e => {
              const d = JSON.parse(e.target.result);
              d.isSaved = true; 
              globalData.push(d); render();
          };
          reader.readAsText(input.files[0]);
          input.value = '';
      }

      async function run() {
          const selects = document.querySelectorAll('.src-select');
          const sites = [];
          selects.forEach(s => {
              if(!s.value) return;
              const [type, idx] = s.value.split('-');
              if(type==='cloud') { const c = cloudSites[idx]; sites.push({ type:'cloud', domain:c.domain, email:c.email, token:c.token }); }
              else { const d = dcConns[idx]; sites.push({ type:'dc', ...d }); }
          });

          if(sites.length) {
              try {
                  const res = await fetch('/api/confluence/stats', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({sites}) });
                  const data = await res.json();
                  globalData = [...globalData, ...data.results];
                  render();
              } catch(e) { alert(e.message); }
          }
      }

      window.dl = idx => {
          const d = globalData[idx];
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([JSON.stringify(d,null,2)], {type:'application/json'}));
          a.download = `conf-stats-${d.domain}.json`; a.click();
      };

      function render() {
          const keys = [['total','Total Spaces'],['active','Active Spaces'],['archived','Archived'],['global','Global Spaces'],['personal','Personal Spaces'],['type','Source Type']];
          let h = '<table><thead><tr><th>Metric</th>';
          globalData.forEach((d,i) => h+=`<th>${d.domain}${d.isSaved?'<br>📂 Saved':''} <button onclick="dl(${i})">⬇️</button></th>`);
          h+='</tr></thead><tbody>';
          keys.forEach(([k,l]) => {
              h+=`<tr><td>${l}</td>` + globalData.map(d => `<td>${d[k]||0}</td>`).join('') + '</tr>';
          });
          document.getElementById('table-area').innerHTML = h + '</tbody></table>';
      }
    </script>
</body>
</html>
