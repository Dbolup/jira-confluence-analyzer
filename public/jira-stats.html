<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jira Site Stats</title>
    <style>
      /* Matched Styling */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #1c1e21;
        padding: 2rem;
        min-height: 100vh;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        padding: 3rem;
        animation: slideUp 0.6s ease-out;
      }
      @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
      h1 {
        font-weight: 700; font-size: 2.5rem; text-align: center; margin-bottom: 1rem;
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }
      .nav-buttons { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
      .nav-btn {
        padding: 0.8rem 2rem; font-size: 1rem; font-weight: 600; border: none; border-radius: 12px;
        cursor: pointer; transition: all 0.3s ease; text-decoration: none; display: inline-block;
      }
      .nav-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
      .nav-btn.inactive { background: #f1f5f9; color: #64748b; }
      .nav-btn.inactive:hover { background: #e2e8f0; transform: translateY(-2px); }

      .site-block {
        background: white; border: 2px solid #f0f0f0; border-radius: 16px; padding: 2rem;
        margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }
      .input-group { margin-bottom: 1rem; }
      label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #374151; }
      input[type="text"] {
        width: 100%; padding: 1rem; border: 2px solid #e5e7eb; border-radius: 12px; background: #fafafa;
      }
      .button-group { display: flex; gap: 1rem; margin-top: 2rem; }
      button { padding: 1rem 2rem; font-size: 1rem; font-weight: 600; border: none; border-radius: 12px; cursor: pointer; color: white; flex: 1; transition: transform 0.2s; }
      .btn-add { background: linear-gradient(135deg, #10b981, #059669); }
      .btn-upload { background: #f59e0b; color: white; }
      .btn-submit { background: linear-gradient(135deg, #667eea, #764ba2); flex: 2; }
      .btn-clear { background: #ef4444; flex: 0.5; }
      
      .stats-container { margin-top: 3rem; display: none; }
      .stats-container.show { display: block; animation: slideUp 0.5s ease; }
      
      table { width: 100%; border-collapse: collapse; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
      th, td { padding: 1.2rem; text-align: center; border-bottom: 1px solid #f1f5f9; }
      th { background: linear-gradient(135deg, #667eea, #764ba2); color: white; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
      td:first-child { text-align: left; font-weight: 600; background: #f8fafc; color: #374151; }
      .metric-value { font-weight: 600; color: #667eea; }
      
      .save-btn {
        background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); 
        padding: 4px 8px; border-radius: 4px; color: white; cursor: pointer; font-size: 0.7rem; margin-left: 8px;
      }
      .save-btn:hover { background: rgba(255,255,255,0.4); }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Jira Site Stats</h1>
      
      <div class="nav-buttons">
        <a href="/" class="nav-btn inactive">🏠 Dashboard</a>
        <div class="nav-btn active">📊 Jira Stats</div>
        <a href="/compare" class="nav-btn inactive">🔄 Jira Compare</a>
        <a href="/insights" class="nav-btn inactive">🔍 Detailed Insights</a>
      </div>

      <form id="site-form">
        <div id="site-inputs"></div>
        
        <input type="file" id="state-upload" accept=".json" style="display:none" onchange="handleFileUpload(this)">

        <div class="button-group">
          <button type="button" class="btn-add" onclick="addSiteInput()">➕ Add Site</button>
          <button type="button" class="btn-upload" onclick="document.getElementById('state-upload').click()">📂 Upload State</button>
          <button type="submit" class="btn-submit" id="submit-btn">📊 Get Stats</button>
          <button type="button" class="btn-clear" onclick="clearResults()">🗑️ Clear</button>
        </div>
      </form>

      <div class="stats-container" id="stats-container">
        <table id="stats-table"></table>
      </div>
    </div>

    <script>
      let siteCounter = 0;
      let allResults = []; // Stores both Live and Uploaded results

      function addSiteInput() {
        const savedCreds = localStorage.getItem('atlassianGlobalCreds');
        if (!savedCreds) {
            if(confirm('No credentials found. Go to setup?')) window.location.href = '/credentials';
            return;
        }

        const container = document.getElementById('site-inputs');
        const div = document.createElement('div');
        div.className = 'site-block';
        div.innerHTML = `
          <div class="input-group">
            <label>🌐 Site URL</label>
            <input type="text" name="domain-${siteCounter}" placeholder="mycompany.atlassian.net" required />
          </div>
          <div style="background: #e0f2fe; padding: 0.8rem; border-radius: 8px; color: #0891b2; font-weight: 600; font-size: 0.9rem;">
            ✅ Using saved credentials
          </div>
        `;
        container.appendChild(div);
        siteCounter++;
      }

      function clearResults() {
          allResults = [];
          document.getElementById('stats-table').innerHTML = '';
          document.getElementById('stats-container').classList.remove('show');
          document.getElementById('site-inputs').innerHTML = '';
          siteCounter = 0;
          addSiteInput();
      }

      // 1. Handle Upload
      function handleFileUpload(input) {
          const file = input.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = function(e) {
              try {
                  const data = JSON.parse(e.target.result);
                  // Ensure it looks like our data
                  if (!data.domain) throw new Error("Invalid state file format");
                  
                  // Mark as saved state for visual distinction
                  data.isSavedState = true; 
                  data.uploadDate = new Date().toLocaleDateString();

                  allResults.push(data);
                  renderTable(allResults);
                  document.getElementById('stats-container').classList.add('show');
              } catch (err) {
                  alert("Error loading file: " + err.message);
              }
          };
          reader.readAsText(file);
          input.value = ''; // Reset
      }

      // 2. Handle Live Analysis
      document.getElementById('site-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span>Analyzing...';

        const savedCreds = JSON.parse(localStorage.getItem('atlassianGlobalCreds'));
        const sites = [];
        
        const inputs = document.querySelectorAll('[name^="domain-"]');
        if(inputs.length === 0 && allResults.length === 0) {
            alert("Please add a site or upload a state.");
            btn.disabled = false; btn.innerHTML = originalText;
            return;
        }

        for (let i = 0; i < inputs.length; i++) {
            if(!inputs[i].value) continue;
            const domain = inputs[i].value.replace(/^https?:\/\//, '').replace(/\/$/, '').replace('.atlassian.net', '');
            sites.push({ domain, email: savedCreds.email, token: savedCreds.token });
        }

        if(sites.length > 0) {
            try {
                const res = await fetch('/api/stats', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sites })
                });
                
                const data = await res.json();
                // Append new live results to existing (uploaded) results
                allResults = [...allResults, ...data.results];
                renderTable(allResults);
                document.getElementById('stats-container').classList.add('show');
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
        
        btn.disabled = false;
        btn.innerHTML = originalText;
      });

      // 3. Download Logic
      window.downloadState = function(index) {
          const data = allResults[index];
          const filename = `jira-state-${data.domain}-${new Date().toISOString().slice(0,10)}.json`;
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          a.click();
          window.URL.revokeObjectURL(url);
      };

      function renderTable(results) {
        const metrics = [
          ['boardCount', '📌 Boards'],
          ['dashboardCount', '📊 Dashboards'],
          ['fieldCount', '🏷️ Custom Fields'],
          ['fieldConfigurationCount', '⚙️ Field Configurations'],
          ['fieldConfigurationSchemeCount', '🔧 Field Configuration Schemes'],
          ['filterCount', '🔍 Filters'],
          ['issueSecuritySchemeCount', '🔒 Issue Security Schemes'],
          ['issueTypeCount', '🎫 Issue Types'],
          ['issueTypeSchemeCount', '📝 Issue Type Schemes'],
          ['issueTypeScreenSchemeCount', '📱 Issue Type Screen Schemes'],
          ['notificationSchemeCount', '📧 Notification Schemes'],
          ['permissionSchemeCount', '🔐 Permission Schemes'],
          ['priorityCount', '⭐ Priorities'],
          ['prioritySchemeCount', '🎯 Priority Schemes'],
          ['projectCount', '📋 Projects'],
          ['resolutionCount', '🔄 Resolutions'],
          ['screenCount', '🖥️ Screens'],
          ['screenSchemeCount', '🖼️ Screen Schemes'],
          ['statusCount', '📊 Statuses'],
          ['workflowCount', '⚙️ Workflows'],
          ['workflowSchemeCount', '🔄 Workflow Schemes']
        ];

        let html = '<tr><th>Metric</th>' + results.map((r, idx) => {
            let title = r.domain;
            if(r.isSavedState) title += `<br><span style="font-size:0.7em; opacity:0.8; font-weight:normal">📂 Saved: ${r.uploadDate}</span>`;
            return `<th>
                ${title}
                <button class="save-btn" onclick="downloadState(${idx})" title="Download State JSON">⬇️</button>
            </th>`;
        }).join('') + '</tr>';
        
        metrics.forEach(([key, label]) => {
          html += `<tr><td>${label}</td>` + 
            results.map(r => {
               if (r.error) return `<td style="color:#ef4444">Error</td>`;
               return `<td><span class="metric-value">${r[key] || 0}</span></td>`;
            }).join('') + '</tr>';
        });

        document.getElementById('stats-table').innerHTML = html;
      }

      addSiteInput();
    </script>
  </body>
</html>
