<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Atlassian Analyzer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
    <style>
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; padding: 3rem; border-radius: 20px; text-align: center; max-width: 900px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        h1 { color: #1e293b; margin-bottom: 2rem; font-weight: 800; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2rem; }
        .card { padding: 2rem; border-radius: 16px; border: 2px solid #e2e8f0; text-decoration: none; color: inherit; transition: 0.3s; background: #fff; display: flex; flex-direction: column; align-items: center; }
        .card:hover { transform: translateY(-5px); border-color: #0052CC; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .title { font-weight: 700; font-size: 1.5rem; color: #1e293b; margin-bottom: 1rem; margin-top: 1rem; }
        .links { display: flex; flex-direction: column; gap: 0.5rem; width: 100%; }
        .link-btn { padding: 0.8rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; text-decoration: none; color: #475569; font-weight: 600; transition: 0.2s; }
        .link-btn:hover { background: #e0f2fe; color: #0052CC; border-color: #0052CC; }
        .setup-btn { display: inline-flex; align-items:center; gap:8px; margin-top: 2rem; color: #fff; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 20px; }
        .setup-btn:hover { background: rgba(255,255,255,0.3); }
        .logo-svg { width: 64px; height: 64px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Atlassian Analyzer</h1>
        <div class="grid">
            <div class="card">
                <img src="/jira.jpg" class="logo-svg" alt="Jira Logo">
                <div class="title">Jira</div>
                <div class="links">
                    <a href="/jira-stats" class="link-btn">📊 General Stats</a>
                    <a href="/insights" class="link-btn">🔍 Detailed Insights</a>
                    <a href="/compare" class="link-btn">⚖️ Compare Projects</a>
                </div>
            </div>
            <div class="card">
                <img src="/confluence-icon.jpg" class="logo-svg" alt="Confluence Logo">
                <div class="title">Confluence</div>
                <div class="links">
                    <a href="/confluence-stats" class="link-btn">📊 General Stats</a>
                    <a href="/confluence-compare" class="link-btn">⚖️ Compare Spaces</a>
                </div>
            </div>
        <a href="/credentials" class="setup-btn">🔑Configure API & DB Credentials</a>
    </div>
</body>
</html>
