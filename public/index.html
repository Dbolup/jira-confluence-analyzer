<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Atlassian Analyzer</title>
    <style>
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; padding: 3rem; border-radius: 20px; text-align: center; max-width: 900px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        h1 { color: #4c1d95; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2rem; }
        .card { padding: 2rem; border-radius: 16px; border: 2px solid #e2e8f0; text-decoration: none; color: inherit; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #667eea; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .title { font-weight: 700; font-size: 1.5rem; color: #1e293b; margin-bottom: 1rem; }
        .links { display: flex; flex-direction: column; gap: 0.5rem; }
        .link-btn { padding: 0.8rem; background: #f1f5f9; border-radius: 8px; text-decoration: none; color: #475569; font-weight: 600; transition: 0.2s; }
        .link-btn:hover { background: #e2e8f0; color: #1e293b; }
        .setup-btn { display: inline-block; margin-top: 2rem; color: #667eea; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Atlassian Analyzer</h1>
        <div class="grid">
            <div class="card">
                <div style="font-size:3rem">🔷</div>
                <div class="title">Jira</div>
                <div class="links">
                    <a href="/jira-stats" class="link-btn">📊 General Stats</a>
                    <a href="/insights" class="link-btn">🔍 Deep Insights</a>
                    <a href="/compare" class="link-btn">⚖️ Compare Projects</a>
                </div>
            </div>

            <div class="card">
                <div style="font-size:3rem">📘</div>
                <div class="title">Confluence</div>
                <div class="links">
                    <a href="/confluence-stats" class="link-btn">📊 General Stats</a>
                    <a href="/confluence-compare" class="link-btn">⚖️ Compare Spaces</a>
                </div>
            </div>
        </div>
        <a href="/credentials" class="setup-btn">🔑 Manage API Credentials</a>
    </div>
</body>
</html>
